<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DB Studio</title>
    <script>
      // Theme before first paint: saved choice (light/dark) or the macOS setting.
      (() => {
        const m = matchMedia('(prefers-color-scheme: dark)');
        const apply = () => { const p = localStorage.getItem('dbs.theme'); document.documentElement.dataset.theme = p === 'light' || p === 'dark' ? p : m.matches ? 'dark' : 'light'; };
        apply(); m.addEventListener('change', apply); window.dbsTheme = apply;
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
