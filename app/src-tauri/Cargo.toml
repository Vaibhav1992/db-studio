[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiberius = { version = "0.12", default-features = false, features = ["rustls", "chrono", "rust_decimal", "tds73"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "process", "macros", "time"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
futures-util = "0.3.34"
chrono = "0.4.45"
uuid = { version = "1.29.0", features = ["v4"] }
rust_decimal = "1.43.0"
dirs = "7.0.0"
keyring = { version = "3", features = ["apple-native"] }
tiny_http = "0.12.0"
tauri-plugin-clipboard-manager = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Dependencies (TDS decoding, JSON) are far too slow unoptimized; keep our own crate fast to rebuild.
[profile.dev.package."*"]
opt-level = 3
